<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Find a Seat | UTM SE&amp;AT</title>

    <!-- Bootstrap 5 + Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Seat Management styles -->
    <link rel="stylesheet" href="css/seat.css">
</head>
<body>

    <!-- ============ HEADER ============ -->
    <header class="app-header">
        <div class="page-container d-flex align-items-center justify-content-between">
            <div>
                <div class="app-header-title">Find a Seat</div>
                <div class="app-header-subtitle">UTM SE&amp;AT</div>
            </div>

            <!-- TEMPORARY: choose a test student until login (User Management) is ready -->
            <div class="test-user" title="Temporary: test student until login is ready">
                <i class="bi bi-person-circle"></i>
                <select id="testUserSelect" class="form-select form-select-sm" aria-label="Test student">
                    <option value="1">Student 1</option>
                    <option value="2">Student 2</option>
                </select>
            </div>
        </div>
    </header>

    <main class="page-container py-3">

        <!-- Messages (success / error) appear here -->
        <div id="messageArea" aria-live="polite"></div>

        <!-- ============ 1. CAFETERIA ============ -->
        <section class="card app-card mb-3">
            <div class="card-body">
                <label for="cafeteriaSelect" class="form-label fw-semibold mb-1">Cafeteria</label>
                <select id="cafeteriaSelect" class="form-select">
                    <option value="">Loading cafeterias…</option>
                </select>
            </div>
        </section>

        <!-- ============ 2. LOCATION ============ -->
        <section class="card app-card mb-3" id="locationCard">
            <div class="card-body d-flex align-items-start gap-3">
                <div id="locationIcon" class="location-icon state-unknown">
                    <i class="bi bi-geo-alt"></i>
                </div>
                <div class="flex-grow-1">
                    <div id="locationTitle" class="fw-semibold">Location not checked</div>
                    <div id="locationText" class="small text-body-secondary">
                        You can only book a seat when you are inside the cafeteria.
                    </div>
                    <button id="verifyLocationBtn" class="btn btn-brand btn-sm mt-2">
                        <i class="bi bi-crosshair"></i> Verify my location
                    </button>
                </div>
            </div>
        </section>

        <!-- ============ 3. SEATS ============ -->
        <section class="card app-card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h2 class="h6 fw-semibold mb-0">Seats</h2>
                    <button id="refreshBtn" class="btn btn-link btn-sm p-0 text-decoration-none">
                        <i class="bi bi-arrow-clockwise"></i>
                        <span id="lastUpdated">Refresh</span>
                    </button>
                </div>

                <!-- Summary counts -->
                <div id="summary" class="summary-row mb-3"></div>

                <!-- Seat grid -->
                <div id="seatGrid" class="seat-grid" aria-label="Seat map"></div>

                <p id="seatHint" class="small text-body-secondary mt-3 mb-0"></p>

                <!-- Legend -->
                <div class="legend mt-3">
                    <span><i class="legend-dot status-available"></i> Available</span>
                    <span><i class="legend-dot status-held"></i> Held</span>
                    <span><i class="legend-dot status-occupied"></i> Occupied</span>
                    <span><i class="legend-dot status-unavailable"></i> Unavailable</span>
                    <span><i class="legend-dot status-mine"></i> Your seat</span>
                </div>
            </div>
        </section>

        <!-- Space so the booking bar does not cover the last card -->
        <div class="booking-bar-spacer"></div>
    </main>

    <!-- ============ 4. MY BOOKING (fixed bar at the bottom) ============ -->
    <section id="bookingBar" class="booking-bar d-none" aria-live="polite">
        <div class="page-container">
            <div class="d-flex align-items-center gap-3">
                <div id="bookingSeatBadge" class="booking-seat-badge">–</div>
                <div class="flex-grow-1">
                    <div id="bookingTitle" class="fw-semibold">–</div>
                    <div id="bookingText" class="small">–</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-2">
                <button id="confirmBtn" class="btn btn-brand flex-grow-1">
                    <i class="bi bi-check2-circle"></i> I'm seated – confirm
                </button>
                <button id="cancelBtn" class="btn btn-outline-secondary">
                    Cancel
                </button>
            </div>
        </div>
    </section>

    <!-- ============ HOLD CONFIRMATION POPUP ============ -->
    <div class="modal fade" id="holdModal" tabindex="-1" aria-labelledby="holdModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="holdModalTitle">Hold seat <span id="holdSeatNumber"></span>?</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    The seat will be held for you for a few minutes.
                    Go to the seat and press <strong>"I'm seated – confirm"</strong> before the time runs out.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Not now</button>
                    <button type="button" class="btn btn-brand" id="holdConfirmBtn">Hold this seat</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/seat.js"></script>
</body>
</html>
